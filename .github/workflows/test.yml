name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rpc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots a full local stack in Docker and applies supabase/migrations/*.
      - name: Start Supabase
        run: supabase start

      # Exposes API_URL / ANON_KEY / SERVICE_ROLE_KEY (and more) to later steps.
      - name: Export Supabase env
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Stop Supabase
        if: always()
        run: supabase stop
